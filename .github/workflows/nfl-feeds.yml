# Refreshes the NFL team calendars (sports/nfl/*.ics) from Wikipedia twice a day, so kickoff times, flexed games,
# results and the postseason come through. Commits only when a calendar changed.
name: NFL calendars

on:
  schedule:
    - cron: "17 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the calendars
        run: python3 tools/nflfeeds.py sports/nfl
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/nfl
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh NFL calendars"
            git push
          fi
