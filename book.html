<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Book a time · Tidemark</title>
<style>
  :root {
    --bg:#F4F7F8; --card:#FFFFFF; --sunken:#E9EFF2; --ink:#0E1A26; --soft:#5E6E7A; --line:rgba(14,26,38,.10);
    --accent:#0B8C8C; --accent2:#2F6FEB; --coral:#FF6B57; --shadow:0 18px 50px -24px rgba(11,37,64,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0A1118; --card:#131D27; --sunken:#0F1820; --ink:#EAF2F5; --soft:#9AAAB5; --line:rgba(234,242,245,.10);
            --accent:#3CCFC4; --accent2:#6C9BFF; --shadow:0 18px 50px -24px rgba(0,0,0,.8); }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .hero { position:relative; overflow:hidden; color:#fff; padding:48px 20px 96px;
          background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); }
  .hero svg { position:absolute; left:0; right:0; bottom:-2px; width:100%; height:90px; }
  .wrap { max-width:880px; margin:0 auto; position:relative; }
  .host { display:flex; align-items:center; gap:16px; }
  .avatar { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; flex:none;
            background:rgba(255,255,255,.2); font:700 26px/1 ui-serif, "New York", Georgia, serif; backdrop-filter:blur(6px); }
  .eyebrow { text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:800; opacity:.85; }
  h1 { font:700 clamp(28px, 5vw, 40px)/1.12 ui-serif, "New York", Georgia, serif; margin:2px 0 0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.18);
          font-size:14px; font-weight:600; }
  main { max-width:880px; margin:-64px auto 0; padding:0 16px 64px; position:relative; }
  .card { background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:22px; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns: 300px 1fr; gap:22px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  h2 { font:700 19px/1.3 ui-serif, "New York", Georgia, serif; margin:0 0 12px; }
  .days { display:flex; flex-direction:column; gap:8px; }
  @media (max-width: 720px) { .days { flex-direction:row; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; } }
  .day { all:unset; cursor:pointer; display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:16px;
         background:var(--sunken); scroll-snap-align:start; flex:none; transition:transform .15s, background .15s; }
  .day:hover { transform:translateY(-1px); }
  .day:focus-visible, .slot:focus-visible, .btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .day .num { font:700 26px/1 ui-serif, "New York", Georgia, serif; min-width:34px; text-align:center; }
  .day .wd { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); }
  .day .cnt { font-size:13px; color:var(--soft); }
  .day[aria-pressed="true"] { background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; }
  .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .cnt { color:rgba(255,255,255,.85); }
  .slots { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:10px; }
  .slot { all:unset; cursor:pointer; text-align:center; padding:12px 8px; border-radius:14px; font-weight:700; font-variant-numeric:tabular-nums;
          color:var(--accent); border:1.5px solid color-mix(in srgb, var(--accent) 40%, transparent);
          background:color-mix(in srgb, var(--accent) 9%, transparent); transition:all .15s; }
  .slot:hover { background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .slot[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tz { color:var(--soft); font-size:13px; margin:14px 0 0; }
  form { display:none; margin-top:22px; padding-top:22px; border-top:1px solid var(--line); }
  form.show { display:block; animation:rise .25s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .picked { font:600 17px/1.4 ui-serif, "New York", Georgia, serif; margin:0 0 14px; }
  label { display:block; font-size:13px; font-weight:700; color:var(--soft); margin:12px 0 6px; }
  input, textarea { width:100%; font:inherit; color:var(--ink); background:var(--sunken); border:1.5px solid transparent;
                    border-radius:12px; padding:12px 14px; outline:none; }
  input:focus, textarea:focus { border-color:var(--accent); }
  textarea { min-height:84px; resize:vertical; }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px;
         border-radius:999px; font-weight:700; text-align:center; }
  .primary { color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow:0 10px 26px -12px var(--accent); }
  .secondary { color:var(--ink); background:var(--sunken); }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .done { display:none; text-align:center; padding:12px 6px 4px; }
  .done.show { display:block; animation:rise .3s ease-out; }
  .tick { width:64px; height:64px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:32px;
          background:linear-gradient(135deg, var(--accent), var(--accent2)); }
  .done h2 { font-size:24px; }
  .done .actions { justify-content:center; }
  .empty { text-align:center; padding:28px 10px; color:var(--soft); }
  .note { color:var(--soft); font-size:13px; margin-top:14px; }
  footer { text-align:center; color:var(--soft); font-size:13px; margin-top:26px; }
  footer a { color:var(--accent); text-decoration:none; font-weight:600; }
  .err { color:var(--coral); font-size:14px; margin-top:8px; display:none; }
  [hidden] { display:none !important; }
  .manage h2 { margin:0 0 4px; }
  .manage .when { font-size:18px; font-weight:700; margin:2px 0; }
  .manage .meta { color:var(--soft); font-size:14px; }
  .manage .actions { margin-top:14px; }
  .linkbox { display:flex; gap:8px; align-items:center; margin-top:14px; background:var(--sunken); border-radius:12px; padding:10px 12px;
             font-size:13px; color:var(--soft); word-break:break-all; text-align:left; }
  .linkbox span { flex:1; }
  .danger { color:var(--coral); background:var(--sunken); }
  .answer { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:8px 14px; border-radius:999px; font-weight:700; font-size:14px; }
  .answer.wait { background:var(--sunken); color:var(--soft); }
  .answer.yes { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .answer.no { background:color-mix(in srgb, var(--coral) 16%, transparent); color:var(--coral); }
  .bell { margin-top:12px; padding:10px 16px; font-size:14px; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="host">
      <div class="avatar" id="avatar" aria-hidden="true">·</div>
      <div>
        <div class="eyebrow">Book a time with</div>
        <h1 id="host">…</h1>
      </div>
    </div>
    <div class="chips">
      <span class="chip" id="chip-title">Meeting</span>
      <span class="chip" id="chip-len">30 min</span>
      <span class="chip" id="chip-tz">Your time zone</span>
    </div>
  </div>
  <svg viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,40 C240,90 480,0 720,36 C960,72 1200,10 1440,44 L1440,90 L0,90 Z" fill="var(--bg)"/>
    <path d="M0,58 C260,20 520,90 760,52 C1000,14 1220,70 1440,40" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/>
  </svg>
</header>

<main>
  <section class="card manage" id="manage" hidden aria-live="polite">
    <div class="eyebrow" style="color:var(--accent)">Your booking</div>
    <div class="when" id="manage-when"></div>
    <div class="meta" id="manage-meta"></div>
    <div class="actions">
      <button class="btn primary" type="button" id="manage-change">Change time or details</button>
      <button class="btn danger" type="button" id="manage-cancel">Cancel booking</button>
    </div>
    <div class="answer wait" id="manage-answer" hidden></div>
    <p class="note" id="manage-status"></p>
    <button class="btn secondary bell" type="button" id="manage-notify" hidden>🔔 Notify me when they answer</button>
  </section>
  <section class="card" id="picker" aria-live="polite">
    <div class="grid">
      <div>
        <h2>Pick a day</h2>
        <div class="days" id="days" role="group" aria-label="Days"></div>
      </div>
      <div>
        <h2 id="slots-title">Available times</h2>
        <div class="slots" id="slots" role="group" aria-label="Times"></div>
        <p class="tz" id="tz-note"></p>
      </div>
    </div>

    <form id="form" novalidate>
      <p class="picked" id="picked"></p>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required maxlength="80">
      <label for="email">Your email <span style="font-weight:500">(optional)</span></label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="120">
      <label for="loc">Where? <span style="font-weight:500">(optional)</span></label>
      <input id="loc" name="loc" autocomplete="street-address" maxlength="160" placeholder="An address, a place, or “video call”">
      <label for="msg">Anything to share? <span style="font-weight:500">(optional)</span></label>
      <textarea id="msg" name="msg" maxlength="400"></textarea>
      <p class="err" id="err">Please add your name.</p>
      <div class="actions">
        <button class="btn primary" type="submit">Request this time</button>
      </div>
    </form>

    <div class="done" id="done">
      <div class="tick" aria-hidden="true">✓</div>
      <h2>Almost there!</h2>
      <p id="done-text"></p>
      <div class="actions" id="send-actions"></div>
      <div id="manage-link"></div>
      <p class="note" id="done-note">Your request goes to <span id="host2"></span>, who adds it to their calendar with one tap.</p>
    </div>
  </section>
  <footer>Scheduling by <a href="./">Tidemark</a> · No account needed · <a href="privacy.html">Privacy</a></footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const b64d = (s) => {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  };
  const b64e = (str) => {
    let bin = '';
    new TextEncoder().encode(str).forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };

  // Booking relay: the request is sealed in this browser with the host's public key (P-256 ECDH, HKDF-SHA256,
  // AES-GCM) and dropped on their private ntfy.sh channel, which can't read it. Tidemark on their devices opens it
  // and adds it to their calendar.
  const bytes = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const b64eBytes = (u8) => { let bin = ''; u8.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const join = (...parts) => { const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0; for (const p of parts) { out.set(p, i); i += p.length; } return out; };
  async function seal(obj, hostKey) {
    const subtle = crypto.subtle;
    const hostRaw = bytes(hostKey);
    const host = await subtle.importKey('raw', hostRaw, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const eph = await subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    const ephRaw = new Uint8Array(await subtle.exportKey('raw', eph.publicKey));
    const shared = await subtle.deriveBits({ name: 'ECDH', public: host }, eph.privateKey, 256);
    const hkdf = await subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    const key = await subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('tidemark-booking-v1'), info: join(ephRaw, hostRaw) },
                                       hkdf, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const sealed = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
    return 'tmb1:' + b64eBytes(join(ephRaw, iv, sealed));
  }
  async function deliver(req) {
    if (!offer.r || !offer.k || !/^[-_A-Za-z0-9]{6,64}$/.test(offer.r) || !(window.crypto && crypto.subtle)) return false;
    try {
      const body = await seal(req, offer.k);
      const res = await fetch('https://ntfy.sh/' + offer.r, { method: 'POST', body });
      return res.ok;
    } catch (e) { return false; }
  }
  window.__tidemarkSeal = seal; // for testing

  // "#<offer>" or, from a guest's own "change or cancel" link, "#<offer>.<booking id>[.<reply channel>.<key>.<secret>]".
  const [token, linkedBooking, linkG, linkPub, linkD] = location.hash.slice(1).split('.');
  let offer;
  try {
    offer = JSON.parse(b64d(token));
    if (!offer || !Array.isArray(offer.w) || !offer.d) throw new Error('bad');
  } catch (e) {
    $('host').textContent = 'This link looks incomplete';
    $('picker').innerHTML = '<div class="empty">Ask for a fresh booking link and open it again.</div>';
    return;
  }

  const host = (offer.n || 'Someone').slice(0, 80);
  const title = (offer.t || 'Meeting').slice(0, 80);
  const minutes = Math.max(5, Math.min(480, offer.d | 0));
  const guestTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.title = `Book ${title} with ${host}`;
  $('host').textContent = host;
  $('host2').textContent = host;
  $('avatar').textContent = host.trim().charAt(0).toUpperCase() || '·';
  $('chip-title').textContent = '📅 ' + title;
  $('chip-len').textContent = '⏱ ' + (minutes < 60 ? `${minutes} min` : `${minutes / 60} hr`);
  $('chip-tz').textContent = '🌍 ' + guestTZ.replace(/_/g, ' ');
  if (offer.z && offer.z !== guestTZ) {
    $('tz-note').textContent = `Times are in your time zone (${guestTZ.replace(/_/g, ' ')}). ${host} is in ${offer.z.replace(/_/g, ' ')}.`;
  } else {
    $('tz-note').textContent = `Times are in ${guestTZ.replace(/_/g, ' ')}.`;
  }

  // Same grid as the app: 15-minute steps for short meetings, otherwise 30.
  const step = (minutes <= 15 ? 15 : 30) * 60000;
  const length = minutes * 60000;
  const soon = Date.now() + 15 * 60000;
  const slots = [];
  for (const pair of offer.w) {
    if (!Array.isArray(pair) || pair.length !== 2) continue;
    const ws = pair[0] * 60000, we = pair[1] * 60000;
    for (let t = Math.ceil(ws / step) * step; t + length <= we; t += step) {
      if (t > soon) slots.push(t);
    }
  }
  slots.sort((a, b) => a - b);

  if (!slots.length) {
    $('picker').innerHTML = `<div class="empty"><h2>No times left</h2>This link has expired or every time has been taken. Ask ${escapeHTML(host)} for a new one.</div>`;
    return;
  }

  const dayKey = (t) => new Date(t).toLocaleDateString('en-CA');
  const byDay = new Map();
  for (const t of slots) {
    const k = dayKey(t);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(t);
  }

  const fmtTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const fmtLong = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  let chosen = null;

  function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderDays(selectedKey) {
    const box = $('days');
    box.innerHTML = '';
    for (const [k, list] of byDay) {
      const d = new Date(list[0]);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'day';
      b.setAttribute('aria-pressed', String(k === selectedKey));
      b.innerHTML = `<span class="num"></span><span><span class="wd"></span><br><span class="cnt"></span></span>`;
      b.querySelector('.num').textContent = d.getDate();
      b.querySelector('.wd').textContent = d.toLocaleDateString(undefined, { weekday: 'long' }) + ' · ' + d.toLocaleDateString(undefined, { month: 'short' });
      b.querySelector('.cnt').textContent = `${list.length} time${list.length === 1 ? '' : 's'}`;
      b.addEventListener('click', () => { renderDays(k); renderSlots(k); });
      box.appendChild(b);
    }
  }

  function renderSlots(k) {
    const list = byDay.get(k);
    $('slots-title').textContent = fmtLong.format(new Date(list[0]));
    const box = $('slots');
    box.innerHTML = '';
    for (const t of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot';
      b.textContent = fmtTime.format(new Date(t));
      b.setAttribute('aria-pressed', String(t === chosen));
      b.addEventListener('click', () => pick(t));
      box.appendChild(b);
    }
  }

  function pick(t) {
    chosen = t;
    renderSlots(dayKey(t));
    $('picked').textContent = `${title} · ${fmtLong.format(new Date(t))}, ${fmtTime.format(new Date(t))} – ${fmtTime.format(new Date(t + length))}`;
    $('form').classList.add('show');
    $('name').focus({ preventScroll: true });
    $('form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  if (offer.r && offer.k) {
    const submit = $('form').querySelector('button[type="submit"]');
    if (submit) submit.textContent = 'Book this time';
  }

  // The guest's own bookings with this host, remembered in this browser (and reachable from their private link).
  // Each one has its own reply channel and key: the host's answer comes back sealed for this page alone.
  const relay = !!(offer.r && offer.k);
  const store = {
    all() { try { return JSON.parse(localStorage.getItem('tidemark-bookings') || '{}'); } catch { return {}; } },
    get(b) { return this.all()[b] || null; },
    save(b, req, extra) {
      try {
        const a = this.all();
        a[b] = Object.assign({}, a[b] || {}, { req, token, r: offer.r }, extra || {});
        localStorage.setItem('tidemark-bookings', JSON.stringify(a));
      } catch {}
    },
    drop(b) { try { const a = this.all(); delete a[b]; localStorage.setItem('tidemark-bookings', JSON.stringify(a)); } catch {} },
  };
  const newID = () => b64eBytes(crypto.getRandomValues(new Uint8Array(9)));
  // The private link carries the reply channel and key too, so the answer shows on any device it's opened on.
  const manageURL = (b) => {
    const rec = store.get(b);
    const reply = rec && rec.g && rec.gkPub && rec.gkPriv ? '.' + [rec.g, rec.gkPub, rec.gkPriv.d].join('.') : '';
    return location.origin + location.pathname + '#' + token + '.' + b + reply;
  };
  let current = null;   // { b, req } being managed
  let editing = false;

  async function replyChannel(b) {
    const have = b && store.get(b);
    if (have && have.g && have.gkPub && have.gkPriv) return { g: have.g, gkPub: have.gkPub, gkPriv: have.gkPriv };
    if (!(window.crypto && crypto.subtle)) return null;
    try {
      const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
      const pub = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
      const priv = await crypto.subtle.exportKey('jwk', kp.privateKey);
      return { g: 'tm-r-' + b64eBytes(crypto.getRandomValues(new Uint8Array(12))), gkPub: b64eBytes(pub), gkPriv: priv };
    } catch { return null; }
  }

  // Opens the host's sealed answer with this booking's key (the same scheme the host's own requests use).
  async function openReply(sealed, rec) {
    if (!sealed || !sealed.startsWith('tmb1:') || !rec.gkPriv || !rec.gkPub) return null;
    try {
      const subtle = crypto.subtle;
      const data = bytes(sealed.slice(5));
      if (data.length < 65 + 12 + 16) return null;
      const ephRaw = data.slice(0, 65), iv = data.slice(65, 77), ct = data.slice(77);
      const priv = await subtle.importKey('jwk', rec.gkPriv, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
      const eph = await subtle.importKey('raw', ephRaw, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
      const shared = await subtle.deriveBits({ name: 'ECDH', public: eph }, priv, 256);
      const hkdf = await subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
      const key = await subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode('tidemark-booking-v1'), info: join(ephRaw, bytes(rec.gkPub)) },
                                         hkdf, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      return JSON.parse(new TextDecoder().decode(await subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)));
    } catch { return null; }
  }

  function findCurrent() {
    const all = store.all();
    if (linkedBooking) {
      // From the private link: the reply key may come with it (another device, or cleared browser data).
      if (linkG && linkPub && linkD && !all[linkedBooking]?.gkPriv) {
        const pub = bytes(linkPub);
        const jwk = { kty: 'EC', crv: 'P-256', x: b64eBytes(pub.slice(1, 33)), y: b64eBytes(pub.slice(33, 65)), d: linkD, ext: true };
        store.save(linkedBooking, all[linkedBooking]?.req || null, { g: linkG, gkPub: linkPub, gkPriv: jwk });
      }
      return { b: linkedBooking, req: store.get(linkedBooking)?.req || null };
    }
    const mine = Object.entries(all).filter(([, v]) => v.r === offer.r && v.req && v.req.s * 60000 > Date.now())
      .sort((a, b) => a[1].req.s - b[1].req.s);
    return mine.length ? { b: mine[0][0], req: mine[0][1].req } : null;
  }
  function describe(req) {
    const t = req.s * 60000;
    return `${fmtLong.format(new Date(t))}, ${fmtTime.format(new Date(t))} – ${fmtTime.format(new Date(t + req.d * 60000))}`;
  }

  // The answer to the request as it stands now (an answer to an earlier version doesn't count).
  function currentAnswer(rec) {
    const a = rec && rec.answer;
    if (!a) return null;
    if (rec.req && (a.q !== rec.req.s || (a.ql || '') !== (rec.req.l || ''))) return null;
    return a;
  }

  function showManage() {
    current = relay ? findCurrent() : null;
    $('manage').hidden = !current;
    if (!current) return;
    const rec = store.get(current.b);
    const ans = currentAnswer(rec);
    const when = ans && ans.a === 'no' && ans.c ? describe(ans) : current.req ? describe(current.req) : ans ? describe(ans) : null;
    $('manage-when').textContent = when ? `${title} · ${when}` : `${title} with ${host}`;
    const place = ans && ans.a === 'no' && ans.c ? ans.l : current.req?.l;
    $('manage-meta').textContent = [place, current.req?.n].filter(Boolean).join(' · ') || 'Pick a new time below, or cancel.';
    $('manage-status').textContent = '';
    const badge = $('manage-answer');
    badge.hidden = !(rec && rec.g);
    let kind = 'wait', text = `Waiting for ${host} to confirm`;
    if (ans && ans.a === 'yes') { kind = 'yes'; text = ans.c ? `${host} accepted your change` : `Confirmed — it's on ${host}'s calendar`; }
    if (ans && ans.a === 'no') { kind = 'no'; text = ans.c ? `${host} couldn't make the new time — the original time stands` : `${host} can't make this time — pick another below`; }
    badge.className = 'answer ' + kind;
    badge.textContent = (kind === 'yes' ? '✓ ' : kind === 'no' ? '✕ ' : '⏳ ') + text;
    const declinedNew = ans && ans.a === 'no' && !ans.c;
    $('manage-change').hidden = declinedNew;
    $('manage-cancel').hidden = declinedNew;
    if (declinedNew) {
      // Nothing booked: straight back to picking a time (a new request).
      editing = false;
      document.querySelector('#picker .grid').style.display = '';
      $('picker').style.display = '';
    }
    // The card from sending the request says what happened once there's an answer.
    if (ans && $('done').classList.contains('show')) {
      const h2 = document.querySelector('#done h2');
      if (kind === 'yes') {
        h2.textContent = 'Confirmed';
        $('done-text').textContent = `${title} on ${describe(ans)}${ans.l ? ' at ' + ans.l : ''} is on ${host}'s calendar.`;
      } else if (ans.c) {
        h2.textContent = 'Original time stands';
        $('done-text').textContent = `${host} couldn't make the new time. You're still booked for ${describe(ans)}${ans.l ? ' at ' + ans.l : ''}.`;
      } else {
        h2.textContent = 'Not this time';
        $('done-text').textContent = `${host} can't make ${describe(ans)}. Pick another time above.`;
        // Nothing booked: nothing to add to a calendar or come back to.
        $('send-actions').innerHTML = '';
        $('manage-link').innerHTML = '';
      }
      $('done-note').textContent = '';
      document.querySelector('#done .tick').textContent = kind === 'yes' ? '✓' : '✕';
    }
    const bell = $('manage-notify');
    bell.hidden = !('Notification' in window) || Notification.permission !== 'default' || kind !== 'wait' || !(rec && rec.g);
    watch();
  }

  // Looks for the host's answer now, every 20 seconds while the page is open, and when it comes back into view.
  let watching = null;
  async function checkAnswer() {
    const b = current && current.b;
    const rec = b && store.get(b);
    if (!rec || !rec.g || !rec.gkPriv) return;
    try {
      const res = await fetch('https://ntfy.sh/' + rec.g + '/json?poll=1&since=all', { cache: 'no-store' });
      if (!res.ok) return;
      let latest = null;
      for (const line of (await res.text()).split('\n')) {
        let m; try { m = JSON.parse(line); } catch { continue; }
        if (m.event !== 'message' || !m.message) continue;
        const r = await openReply(m.message, rec);
        if (r && r.b === b && (!latest || m.time >= latest.time)) latest = Object.assign(r, { time: m.time });
      }
      if (!latest) return;
      const before = currentAnswer(rec);
      store.save(b, rec.req, { answer: latest });
      const now = currentAnswer(store.get(b));
      if (now && (!before || before.a !== now.a || before.time !== now.time)) {
        if (before === null || before.a !== now.a) notifyAnswer(now);
        showManage();
      }
    } catch {}
  }
  function watch() {
    clearInterval(watching);
    const rec = current && store.get(current.b);
    if (!rec || !rec.g) return;
    checkAnswer();
    watching = setInterval(checkAnswer, 20000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAnswer(); });

  function notifyAnswer(a) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const t = a.a === 'yes' ? (a.c ? `${host} accepted your change` : `${host} confirmed ${title}`)
                            : (a.c ? `${host} kept the original time` : `${host} can't make that time`);
    try { new Notification(t, { body: describe(a), tag: 'tidemark-' + a.b }); } catch {}
  }
  $('manage-notify').addEventListener('click', async () => {
    try { await Notification.requestPermission(); } catch {}
    showManage();
  });

  $('manage-change').addEventListener('click', () => {
    editing = true;
    const r = current?.req;
    if (r) { $('name').value = r.n || ''; $('email').value = r.e || ''; $('loc').value = r.l || ''; $('msg').value = r.m || ''; }
    $('manage-status').textContent = 'Pick a new time below (or the same one to just change the details).';
    document.querySelector('#picker .grid').style.display = '';
    $('picker').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('manage-cancel').addEventListener('click', async () => {
    if (!current) return;
    const when = current.req ? describe(current.req) : 'your booking';
    if (!confirm(`Cancel ${title} on ${when}?`)) return;
    const req = { v: 1, k: 'cancel', b: current.b, t: title, s: current.req?.s || Math.round(Date.now() / 60000), d: minutes,
                  n: current.req?.n || 'Guest', h: host };
    $('manage-cancel').disabled = true;
    const ok = await deliver(req);
    $('manage-cancel').disabled = false;
    if (ok) {
      clearInterval(watching);
      store.drop(current.b);
      $('manage-when').textContent = 'Cancelled';
      $('manage-meta').textContent = `${host} has been told.`;
      $('manage-answer').hidden = true;
      $('manage-notify').hidden = true;
      document.querySelectorAll('#manage .actions .btn').forEach(b => b.hidden = true);
      // The "Request sent" card from earlier no longer applies, and there's nothing left to pick.
      $('done').classList.remove('show');
      $('form').classList.remove('show');
      $('picker').style.display = 'none';
    } else {
      $('manage-status').textContent = "That didn't go through. Check your connection and try again.";
    }
  });
  showManage();

  const first = byDay.keys().next().value;
  renderDays(first);
  renderSlots(first);

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name = $('name').value.trim();
    if (!name) { $('err').style.display = 'block'; $('name').focus(); return; }
    $('err').style.display = 'none';
    const email = $('email').value.trim();
    const msg = $('msg').value.trim();
    const where = $('loc').value.trim();
    const req = { v: 1, t: title, s: Math.round(chosen / 60000), d: minutes, n: name, h: host };
    if (email) req.e = email;
    if (msg) req.m = msg;
    if (where) req.l = where;
    let channel = null;
    if (relay) {
      req.b = editing && current ? current.b : newID();
      if (editing && current) req.k = 'edit';
      // Where the host's answer comes back to.
      channel = await replyChannel(req.b);
      if (channel) { req.g = channel.g; req.gk = channel.gkPub; }
    }
    const confirmURL = new URL('confirm.html#' + b64e(JSON.stringify(req)), location.href).href;
    const when = `${fmtLong.format(new Date(chosen))} at ${fmtTime.format(new Date(chosen))} (${guestTZ.replace(/_/g, ' ')})`;
    const text = `Hi ${host}, I'd like to book "${title}" on ${when}.${msg ? '\n\n' + msg : ''}\n\nAdd it to your calendar: ${confirmURL}\n\n— ${name}`;

    const submit = $('form').querySelector('button[type="submit"]');
    const submitLabel = submit ? submit.textContent : '';
    if (submit) { submit.disabled = true; submit.textContent = 'Booking…'; }
    const delivered = await deliver(req);
    if (submit) { submit.disabled = false; submit.textContent = submitLabel; }
    $('form').classList.remove('show');
    document.querySelector('#picker .grid').style.display = 'none';
    const actions = $('send-actions');
    actions.innerHTML = '';
    const add = (label, cls, fn, href) => {
      const el = document.createElement(href ? 'a' : 'button');
      el.className = 'btn ' + cls;
      el.textContent = label;
      if (href) el.href = href; else { el.type = 'button'; el.addEventListener('click', fn); }
      actions.appendChild(el);
      return el;
    };
    if (delivered) {
      // With the host now: they accept or decline, and the answer shows here.
      store.save(req.b, req, Object.assign({ answer: null }, channel || {}));
      const changed = req.k === 'edit';
      editing = false;
      showManage();
      document.querySelector('#done h2') && (document.querySelector('#done h2').textContent = changed ? 'Change requested' : 'Request sent');
      document.querySelector('#done .tick').textContent = '✓';
      $('done-text').textContent = `${title} on ${when}${where ? ' at ' + where : ''}. ${host} will confirm, and you'll see the answer here.`;
      $('done-note').textContent = `${host} gets a notification from Tidemark and accepts or declines. Nothing else to send.`;
      if ('Notification' in window && Notification.permission === 'default' && channel) {
        const bell = add('Notify me when they answer', 'primary', async () => {
          try { await Notification.requestPermission(); } catch {}
          bell.textContent = Notification.permission === 'granted' ? "We'll let you know ✓" : 'Notifications are off';
          showManage();
        });
      }
      add('Add to my calendar', 'secondary', () => downloadICS(req));
      // A private link to come back and change or cancel (this browser also remembers it).
      const link = manageURL(req.b);
      const box = document.createElement('div');
      box.className = 'linkbox';
      box.innerHTML = '<span></span>';
      box.querySelector('span').textContent = 'To change or cancel later, keep this link: ' + link;
      const copy = document.createElement('button');
      copy.className = 'btn secondary'; copy.type = 'button'; copy.textContent = 'Copy'; copy.style.padding = '8px 14px';
      copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(link); copy.textContent = 'Copied ✓'; } catch { prompt('Copy this link:', link); } });
      box.appendChild(copy);
      $('manage-link').innerHTML = '';
      $('manage-link').appendChild(box);
      $('done').classList.add('show');
      $('done').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    $('done-text').textContent = `Send your request for ${when} to ${host}.`;
    if (offer.e) {
      add(`Email ${host}`, 'primary', null,
          `mailto:${encodeURIComponent(offer.e)}?subject=${encodeURIComponent(`Booking request: ${title} — ${when}`)}&body=${encodeURIComponent(text)}`);
    }
    if (navigator.share) {
      add(offer.e ? 'Send another way' : `Send to ${host}`, offer.e ? 'secondary' : 'primary',
          () => navigator.share({ title: `Booking request: ${title}`, text }).catch(() => {}));
    }
    const copyBtn = add('Copy request', 'secondary', async () => {
      try { await navigator.clipboard.writeText(text); copyBtn.textContent = 'Copied ✓'; }
      catch { prompt('Copy this and send it:', text); }
    });
    add('Add to my calendar', 'secondary', () => downloadICS(req));
    $('done').classList.add('show');
    $('done').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  function downloadICS(req) {
    const stamp = (t) => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const esc = (s) => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
    const start = req.s * 60000;
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tidemark//Booking//EN', 'BEGIN:VEVENT',
      `UID:${req.s}-${Math.random().toString(36).slice(2)}@tidemark`, `DTSTAMP:${stamp(Date.now())}`,
      `DTSTART:${stamp(start)}`, `DTEND:${stamp(start + req.d * 60000)}`,
      ...(req.l ? [`LOCATION:${esc(req.l)}`] : []),
      `SUMMARY:${esc(`${req.t} with ${host}`)}`, 'STATUS:TENTATIVE',
      `DESCRIPTION:${esc(`Requested through Tidemark. Waiting for ${host} to confirm.`)}`,
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = `${req.t.replace(/[^\w ]+/g, '').trim() || 'meeting'}.ics`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
})();
</script>
</body>
</html>
